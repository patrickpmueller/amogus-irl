plugins {
    id 'java'
}

group = 'com.pellacanimuller'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.glassfish:javax.json:1.1.4'
    implementation 'org.apache.logging.log4j:log4j-core:2.23.0'
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.23.0'
    implementation 'com.moandjiezana.toml:toml4j:0.7.2'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.3'
    testRuntimeOnly  'org.junit.jupiter:junit-jupiter-engine:5.10.3'
    implementation   'org.mockito:mockito-core:5.12.0'
    implementation   'org.mockito:mockito-junit-jupiter:5.12.0'
}

test {
    useJUnitPlatform()
}

// Equivalent of maven-assembly-plugin: fat jar with all dependencies
jar {
    archiveFileName = 'backend-server.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes 'Main-Class': 'com.pellacanimuller.amogus_irl.Main'
    }

    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}

tasks.register('npmInstall', Exec) {
    workingDir = file('src/main/client')
    commandLine 'npm', 'install'
}

tasks.register('npmBuild', Exec) {
    workingDir = file('src/main/client')
    dependsOn 'npmInstall'
    commandLine 'npm', 'run', 'build'
	commandLine 'mv', 'dist/', '../../../build/frontend/'
}

tasks.register('buildFrontend') {
    dependsOn 'npmBuild'
}
