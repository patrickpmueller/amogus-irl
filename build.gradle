plugins {
    id 'java'
}

def getDockerUser() {
    return findProperty('dockerUser')
        ?: System.getenv('DOCKER_USER')
        ?: 'local'
}

def getImageBase() {
    return "${getDockerUser()}/amogus-irl"
}
group = 'com.pellacanimuller'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.glassfish:javax.json:1.1.4'
    implementation 'org.apache.logging.log4j:log4j-core:2.23.0'
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.23.0'
    implementation 'com.moandjiezana.toml:toml4j:0.7.2'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.3'
    testRuntimeOnly  'org.junit.jupiter:junit-jupiter-engine:5.10.3'
    implementation   'org.mockito:mockito-core:5.12.0'
    implementation   'org.mockito:mockito-junit-jupiter:5.12.0'
}

test {
    useJUnitPlatform()
}

// Equivalent of maven-assembly-plugin: fat jar with all dependencies
jar {
    archiveFileName = 'backend-server.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes 'Main-Class': 'com.pellacanimuller.amogus_irl.Main'
    }

    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}

tasks.register('npmInstall', Exec) {
    workingDir = file('src/main/client')
    commandLine 'npm', 'install'
}

tasks.register('npmBuild', Exec) {
    workingDir = file('src/main/client')
    dependsOn 'npmInstall'
    commandLine 'npm', 'run', 'build'
}

tasks.register('copyFrontend', Copy) {
    dependsOn 'npmBuild'
    from 'src/main/client/dist/'
    into 'build/frontend/'
}


tasks.register('prepareGameServerDockerContext', Copy) {
    dependsOn 'jar'

    from('build/libs/backend-server.jar') {
        rename { 'gameserver-full.jar' }
    }
    into 'docker/gameserver'

    from('src/main/resources/settings.toml')
    into 'docker/gameserver'
}

tasks.register('prepareWebServerDockerContext', Copy) {
    dependsOn 'copyFrontend'

    from('build/frontend/')
    into 'docker/webserver/dist'
}

tasks.register('buildGameServerImage', Exec) {
    dependsOn 'prepareGameServerDockerContext'

    commandLine 'docker', 'build',
        '-t', "${getImageBase()}:gameserver",
        'docker/gameserver'
}

tasks.register('buildWebServerImage', Exec) {
    dependsOn 'prepareWebServerDockerContext'

    commandLine 'docker', 'build',
        '-t', "${getImageBase()}:webserver",
        'docker/webserver'
}

tasks.register('pushGameServerImage', Exec) {
    dependsOn 'buildGameServerImage'

    commandLine 'docker', 'push',
        "${getImageBase()}:gameserver"
}

tasks.register('pushWebServerImage', Exec) {
    dependsOn 'buildWebServerImage'

    commandLine 'docker', 'push',
        "${getImageBase()}:webserver"
}

tasks.register('buildDocker') {
    dependsOn 'buildGameServerImage', 'buildWebServerImage'
}

tasks.register('pushDocker') {
    dependsOn 'pushGameServerImage', 'pushWebServerImage'
}
